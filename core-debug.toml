schema_version = 1

[core]
name = "SSV"
platform = "MiSTer"
top = "Arcade-SSV.sv"
profile = "one universal Arcade-SSV.rbf selected by MRA descriptors"
status_file = "docs/implementation-status.md"
coverage_file = "docs/GAME_COVERAGE.md"
manifest = "tools/ssv_supported_sets.py"

[reference]
emulator = "MAME"
version = "0.289 (mame0289) executable and matching source tag"
executable = "D:\\Arcade\\AI\\mameexe\\mame.exe"
source_root = "D:\\Arcade\\AI\\mame289"
driver_files = ["src/mame/seta/ssv.cpp", "src/mame/seta/ssv_v.cpp"]
known_imperfect = []

[commands]
validate_profile = "python tools/verify_ssv_universal_profile.py --require-roms"
validate_python = "python -m py_compile tools/gen_ssv_mras.py tools/ssv_cfg_block.py tools/ssv_supported_sets.py tools/verify_ssv_universal_profile.py"
build_headless_model = "powershell -NoProfile -ExecutionPolicy Bypass -File tools/build_ssv_headless.ps1"
rtl_capture = "powershell -NoProfile -ExecutionPolicy Bypass -File tools/run_ssv_headless.ps1 -Set <set> -Session <workspace-session> -Scenario gameplay_neutral -ScenarioFile verif/scenarios/<set>/gameplay_neutral.json"
mame_capture = "powershell -NoProfile -ExecutionPolicy Bypass -File tools/run_ssv_mame_headless.ps1 -Set <set> -Session <workspace-session> -ScenarioFile verif/scenarios/<set>/gameplay_neutral.json"
focused_tests = "powershell -NoProfile -ExecutionPolicy Bypass -File verif/run_all_focused_no_rbf.ps1"
audio_tests = "powershell -NoProfile -ExecutionPolicy Bypass -File verif/run_all_focused_no_rbf.ps1"
reference_gameplay = "powershell -NoProfile -ExecutionPolicy Bypass -File tools/run_ssv_headless.ps1 -Set <set> -Session <workspace-session>"
all_set_profile_audit = "python tools/verify_ssv_universal_profile.py --require-roms"
quartus_build = "powershell -File tools/build-ssv.ps1 -QuartusRoot D:\\Q17"

[permissions]
quartus_build = "explicit-user-authorization-and-exclusive-project-slot"
private_media = "local-rom-archives-required; never commit"

[artifacts]
private = ["rom/", "keys/", "disks/", "nvram/"]
generated = ["tmp/", "sim_output/", "verif/captures/", "verif/traces/"]
preserve_between_runs = ["db/", "incremental_db/", ".simcache/"]

[trace]
schema = "mister-raw-trace-v4; cpu_data candidate strict; mainbus diagnostic; no acceptance resynchronization"
compare_units = ["device", "address", "data", "byte_enable", "rw", "phase"]
strict_domain = "cpu_data"
headless = true
display_backend = "none"
model_threads = 1

[video]
native_width = 336
native_height = 240
rotation = "set-selected; framework presentation remains shared"
capture_format = "P6"

[verification]
attract_gate = "legacy diagnostic only; gameplay acceptance starts at the scenario's verified entry barrier"
gameplay_gate = "first verified gameplay entry followed by exactly 120 native neutral frames; no post-entry input"
strict_domain = "cpu_data (mainbus device 1 program-ROM fetches excluded; mainbus remains diagnostic)"
mame_screenshots_count = false
